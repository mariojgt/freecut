name: freecut

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: freecut-web:local
    ports:
      - "127.0.0.1:${FREECUT_WEB_PORT:-8080}:8080"
    restart: unless-stopped

  headless:
    # Google Chrome for Linux is published for amd64. Docker Desktop runs this
    # image through emulation on Apple Silicon; native amd64 Linux is unchanged.
    platform: ${FREECUT_HEADLESS_PLATFORM:-linux/amd64}
    build:
      context: .
      dockerfile: headless/Dockerfile
    image: freecut-headless:local
    container_name: freecut-headless
    environment:
      FREECUT_API_TOKEN: ${FREECUT_API_TOKEN:-}
    ports:
      - "127.0.0.1:${FREECUT_API_PORT:-8787}:8787"
    volumes:
      - "${FREECUT_WORKSPACE:-./freecut-workspace}:/workspace"
      - "${FREECUT_MCP_OUTPUT:-./freecut-output}:/output"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8787/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 3s
      start_period: 20s
      retries: 6

  # The MCP endpoint an LLM client connects to. Supervised by Docker, so it
  # comes back after a crash or a host reboot with nothing to run by hand.
  mcp:
    platform: ${FREECUT_HEADLESS_PLATFORM:-linux/amd64}
    build:
      context: .
      dockerfile: headless/Dockerfile
    image: freecut-headless:local
    container_name: freecut-mcp
    depends_on:
      headless:
        condition: service_healthy
    environment:
      # Talks to the API container over the compose network. Autostart is off
      # BECAUSE that API is its own service: a supervisor spawning a second
      # serve.mjs here would put two writers on one workspace volume.
      FREECUT_API_URL: http://headless:8787
      FREECUT_API_TOKEN: ${FREECUT_API_TOKEN:-}
      FREECUT_MCP_AUTOSTART: "0"
      FREECUT_MCP_TOKEN: ${FREECUT_MCP_TOKEN:-}
    ports:
      - "${FREECUT_MCP_BIND:-127.0.0.1}:${FREECUT_MCP_PORT:-8788}:8788"
    volumes:
      - "${FREECUT_MCP_OUTPUT:-./freecut-output}:/output"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8788/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 6
    command: ["node", "mcp/http-server.mjs", "--host", "0.0.0.0", "--port", "8788"]

  ollama:
    profiles: [local-ai]
    image: ollama/ollama:latest
    environment:
      OLLAMA_ORIGINS: "http://localhost:${FREECUT_WEB_PORT:-8080},http://127.0.0.1:${FREECUT_WEB_PORT:-8080}"
    ports:
      - "127.0.0.1:${FREECUT_LLM_PORT:-11434}:11434"
    volumes:
      - ollama-models:/root/.ollama
    restart: unless-stopped

volumes:
  ollama-models:
